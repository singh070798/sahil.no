<style>
/* CV editor — layout only; buttons, fields and panels come from
   tool.css. A bar with the save state and actions stays at the top
   while you scroll. Below it, the form on the left (one white panel
   per CV section, with the CV's own black heading bar) and the A4
   page on the right, which stays in view. Below 960px one shows at
   a time, switched with the Edit / Preview tabs. */
[hidden] { display: none !important; }
.cv { --bar-h: 4rem; padding-top: 0; }

.cv-bar {
  position: sticky; top: 0; z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1rem;
  min-height: var(--bar-h); padding: 0.75rem 0; margin-bottom: 1.5rem;
  background: var(--bg-deep); border-bottom: 1px solid var(--line);
  padding-top: calc(0.75rem + env(safe-area-inset-top, 0px));
}
.cv-bar .chip { margin-right: auto; }
.actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chip {
  font-family: var(--font-display); font-weight: 600; font-size: 0.8125rem; letter-spacing: var(--tracking-label);
  text-transform: uppercase; padding: 0.4rem 0.6rem; border-radius: 4px; border: 1px solid currentColor;
  white-space: nowrap; color: var(--ink-faint);
}
.chip[data-s="dirty"] { color: var(--warn); }
.chip[data-s="saved"] { color: var(--ok); }

.tool .btn.armed { background: var(--danger); border-color: var(--danger); color: var(--paper); }

.tabs { display: none; gap: 0.35rem; margin-bottom: 1.25rem; }
.tabs button {
  flex: 1; font-family: var(--font-display); font-weight: 600; font-size: 0.8125rem; letter-spacing: var(--tracking-label);
  text-transform: uppercase; padding: 0.65rem; border-radius: 999px; border: 1px solid var(--line-strong);
  background: transparent; color: var(--ink-dim); cursor: pointer;
}
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

.work { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: var(--grid-gap); }
.editor { display: flex; flex-direction: column; gap: 0.9rem; min-width: 0; }
.preview { min-width: 0; }
.sheet-wrap { position: sticky; top: calc(var(--bar-h) + 1.25rem); display: flex; flex-direction: column; gap: 0.6rem; }
.sheet-meta { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.sheet-meta .over { color: var(--danger); }
.sheet { width: 100%; max-width: 640px; margin: 0 auto; background: #fff; line-height: 0; border-radius: 2px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3); }
.sheet svg { width: 100%; height: auto; display: block; }

/* the "restore earlier edits" notice */
.banner {
  display: flex; flex-wrap: wrap; gap: 0.5rem 0.75rem; align-items: center; justify-content: space-between;
  padding: 0.75rem 0.9rem; border-radius: var(--radius); background: var(--paper); color: var(--licorice);
  border-left: 4px solid var(--accent);
  --ink: #14110f; --ink-dim: #4a4642; --accent: var(--signal-blue); --line-strong: rgba(20, 17, 15, 0.28); --on-accent: var(--paper);
}

/* one panel per CV section, with a black heading bar like the CV */
.card { min-width: 0; overflow: hidden; }
.card > summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 0.6rem;
  padding: 0 0.5rem 0 0.75rem; min-height: 2.5rem; background: var(--licorice); color: var(--paper);
}
.card > summary::-webkit-details-marker { display: none; }
.card .bar-title {
  font-family: var(--font-display); font-weight: 600; font-size: 0.875rem; letter-spacing: var(--tracking-label);
  text-transform: uppercase; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card .bar-meta {
  font-family: var(--font-display); font-weight: 600; font-size: 0.75rem; letter-spacing: var(--tracking-label);
  text-transform: uppercase; opacity: 0.7; white-space: nowrap;
}
.card .caret { width: 18px; text-align: center; font-size: 0.8rem; opacity: 0.8; transition: transform 0.15s ease; }
.card[open] .caret { transform: rotate(90deg); }
.card-body { padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }

.group-label {
  font-family: var(--font-display); font-weight: 600; font-size: 0.8125rem; letter-spacing: var(--tracking-label);
  text-transform: uppercase; color: var(--ink-faint); padding-top: 0.4rem;
}
.field { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
.field > span { font-size: 0.8125rem; font-weight: 600; color: var(--ink-dim); }
.field input, .field textarea, .field select { width: 100%; }
.field textarea { min-height: 64px; }
.row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: flex-end; }
.row > .field { flex: 1 1 140px; }
.contact { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto; gap: 0.5rem; align-items: end; }
.tools { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; justify-content: flex-end; }
.entry { border: 1px solid var(--line); border-radius: 6px; padding: 0.65rem; display: flex; flex-direction: column; gap: 0.5rem; background: var(--sunk); }
.entry-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.entry-num {
  font-family: var(--font-display); font-weight: 600; font-size: 0.75rem; letter-spacing: var(--tracking-label);
  text-transform: uppercase; color: var(--ink-faint);
}
.add-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.hint { font-size: 0.875rem; color: var(--ink-faint); }
.col-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; padding-top: 1rem; }
.col-head h2 {
  margin: 0; font-family: var(--font-display); font-weight: 600; font-size: var(--text-label);
  letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--accent);
}
.col-head span { font-size: 0.875rem; color: var(--ink-faint); }
.empty { font-size: 0.875rem; color: var(--ink-faint); padding: 0.65rem 0.75rem; border: 1px dashed var(--line-strong); border-radius: 6px; }
.loading { padding: 2.5rem 1rem; color: var(--ink-faint); text-align: center; }

@media (max-width: 959px) {
  .tabs { display: flex; }
  .work { grid-template-columns: minmax(0, 1fr); }
  body:not(.show-preview) .preview { display: none; }
  body.show-preview .editor { display: none; }
  .sheet-wrap { position: static; }
}
@media (max-width: 520px) {
  .contact { grid-template-columns: minmax(0, 1fr) auto; }
  .contact .field:nth-child(2) { grid-column: 1 / -1; grid-row: 2; }
}
</style>
</head>

<div class="case-topbar">

      <picture class="logo-motion__still">
        <source media="(min-width: 684px)" srcset="../images/sahil-logo-still-ss02.webp" width="2000" height="1000">
        <img src="../images/sahil-logo-mobile-still-ss04.webp" alt="" width="1200" height="470">

        data-src-wide="../images/sahil-logo-motion-ss02.mp4"
        data-src-narrow="../images/sahil-logo-motion-mobile-ss04.mp4"></canvas>
    </span>
  </a>
  <a class="back-link" href="./">Tools</a>
</div>

  <div class="case-header">
    <h1 class="case-header__title">CV editor</h1>
    <p class="tool-lede">Edit the CV section by section and watch the A4 page update as you type. When it fits on one page, download it as a PDF.</p>

    <dl class="case-meta">
      <div>
        <dt>Input</dt>
        <dd>The CV, as text</dd>
      </div>
      <div>
        <dt>Output</dt>
        <dd>A one-page A4 PDF</dd>
      </div>
      <div>
        <dt>Saves</dt>
        <dd>In this browser, or as a data file</dd>
      </div>
    </dl>
  </div>

</header>

<main class="tool cv">
  <div class="cv-bar">
    <span class="chip" id="status" data-s="loading">Loading</span>
    <div class="actions">
      <button class="btn btn--primary" id="saveBtn" type="button" disabled>Save changes</button>
      <button class="btn" id="pdfBtn" type="button">Download PDF</button>
      <button class="btn" id="exportBtn" type="button">Export data</button>
      <button class="btn" id="importBtn" type="button">Import data</button>
    </div>
  </div>
  <div class="tabs" role="group" aria-label="View">
    <button type="button" id="tabEdit" aria-pressed="true">Edit</button>
    <button type="button" id="tabPreview" aria-pressed="false">Preview</button>
  </div>
  <div class="work">
    <section class="editor" id="editor" aria-label="Editor"><div class="loading">Loading your CV…</div></section>
    <section class="preview" aria-label="Preview">
      <div class="sheet-wrap">
        <div class="sheet-meta tool-label"><span>A4 · 210 × 297 mm</span><span id="fit">Fits on one page</span></div>
        <div class="sheet" id="sheet"></div>
      </div>
    </section>
  </div>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <div class="tool-toast" id="toast" role="status" aria-live="polite" hidden></div>
</main>

// CV layout engine: turns CV data into positioned draw operations (points, top-left origin).
// The same operations drive the on-screen SVG preview and the PDF export.
const CVEngine = (() => {
  const PW = 595.28, PH = 841.89;
  const COLS = {
    left:  { barX: 25,  barW: 359, x: 28.4,  w: 350, size: 10, lead: 12,  first: 23.6, gap: 9.4,  bullet: 8.25 },
    right: { barX: 391, barW: 176, x: 395.4, w: 165, size: 8,  lead: 9.6, first: 23,   gap: 11.4, bullet: 6.6 }
  };

  // Inline markup: **bold**, *italic*, __underline__
  function parse(str, base) {
    base = base || {};
    const out = [];
    let b = !!base.b, i = !!base.i, u = !!base.u;
    for (const tok of String(str).split(/(\*\*|\*|__)/)) {
      if (tok === '**') b = !b;
      else if (tok === '*') i = !i;
      else if (tok === '__') u = !u;
      else if (tok) out.push({ t: tok, b, i, u });
    }
    return out;
  }

  const same = (a, b) => a.b === b.b && a.i === b.i && a.u === b.u;

  function layout(cv, measure) {
    const ops = [];
    let maxY = 0;
    const M = (t, st, size) => measure(t, st, size);

    function text(x, top, t, size, st, color, cs) {
      const y = top + size * 0.8;
      const w = M(t, st, size) + (cs ? cs * t.length : 0);
      ops.push({ k: 't', x, y, t, size, b: !!st.b, i: !!st.i, color: color || '#000', cs: cs || 0 });
      if (st.u) ops.push({ k: 'l', x1: x, y1: y + 1.3, x2: x + w, y2: y + 1.3, lw: size >= 10 ? 0.45 : 0.36, color: color || '#000' });
      maxY = Math.max(maxY, y + 2);
      return w;
    }

    function wrap(runs, size, maxW) {
      const toks = [];
      for (const r of runs) for (const p of r.t.split(/( +)/)) if (p) toks.push({ ...r, t: p, sp: /^ +$/.test(p) });
      const lines = [];
      let line = [], w = 0;
      const trim = l => { while (l.length && l[l.length - 1].sp) l.pop(); };
      for (const tk of toks) {
        const tw = M(tk.t, tk, size);
        if (tk.sp) { if (line.length) { line.push(tk); w += tw; } continue; }
        if (line.length && w + tw > maxW) { trim(line); lines.push(line); line = []; w = 0; }
        line.push(tk); w += tw;
      }
      trim(line);
      if (line.length) lines.push(line);
      return lines.map(l => l.reduce((acc, tk) => {
        const last = acc[acc.length - 1];
        if (last && same(last, tk)) last.t += tk.t; else acc.push({ t: tk.t, b: tk.b, i: tk.i, u: tk.u });
        return acc;
      }, []));
    }

    function drawLine(x, top, runs, size) {
      for (const r of runs) x += text(x, top, r.t, size, r);
    }

    function block(x, top, str, size, maxW, lead, base) {
      let y = top;
      const s = String(str || '').replace(/^\s*\n|\n\s*$/g, '').replace(/\r/g, '');
      if (!s.trim()) return y;
      for (const p of s.split('\n')) {
        if (!p.trim()) { y += lead; continue; }
        for (const ln of wrap(parse(p.trim(), base), size, maxW)) { drawLine(x, y, ln, size); y += lead; }
      }
      return y;
    }

    function bar(C, top, label) {
      ops.push({ k: 'r', x: C.barX, y: top, w: C.barW, h: 14, color: '#000' });
      text(C.barX + 3.4, top + 4.3, String(label || '').toUpperCase(), 8, { b: true }, '#fff', 0.4);
    }

    // Header
    const LX = 27.8;
    text(LX, 29.7, cv.name || '', 20, { b: true });
    let y = 53.7;
    if ((cv.title || '').trim()) drawLine(LX, y, parse(cv.title, { i: true, u: true }), 10);

    }

    const json = serialize();
    try {
      await artifact.publish({ 'data/cv.json': { content: json, contentType: 'application/json' } });
      savedJSON = json;
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      toast('Saved. Anyone who opens this page sees the new version.');
    } catch (err) {
      const code = err && err.code;
      if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'not_declared') {
        readOnly = true; toast('This copy is view only. Use Export data to keep your edits.');
      } else if (code === 'capability_disabled' || code === 'capability_removed') {
        readOnly = true; toast('Saving isn’t available here. Use Export data to keep your edits.');
      } else if (code === 'conflict') {
        try { localStorage.setItem(DRAFT_KEY, json); } catch (e) {}
        toast('A newer version was saved elsewhere. The page will reload; your edits can be restored.');
      } else if (code === 'rate_limited') {
        toast('Saving too often. Wait a moment and try again.');
      } else {
        toast('Couldn’t save just now. Try again in a moment.');
      }
    } finally { saving = false; setStatus(); }
  }

  async function offerFile(filename, data) {
    const downloads = await (downloadsP = downloadsP || use('downloads'));
    if (STANDALONE) {
      const blob = data instanceof Blob ? data : new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = h('a', { href: url, download: filename });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return;
    }
    if (!downloads) { toast('Downloads aren’t available in this view.'); return; }
    try { await downloads.save({ filename, data }); }
    catch (err) {
      const code = err && err.code;
      if (code === 'declined') return;
      if (code === 'rate_limited') toast('A download prompt is already open.');
      else toast('The file couldn’t be offered for download here.');
    }
  }

  function fileBase() { return (cv.name || 'CV').trim().replace(/[^\p{L}\p{N}]+/gu, '_').replace(/^_|_$/g, '') || 'CV'; }

  function buildPDF() {
    const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4', compress: true });
    addFonts(doc);
    doc.setProperties({ title: `${cv.name} – CV`, author: cv.name, creator: 'CV Editor' });
    cache.clear();
    const { ops } = E.layout(cv, measure);
    for (const o of ops) {
      const rgb = o.color === '#fff' ? [255, 255, 255] : [0, 0, 0];
      if (o.k === 'r') { doc.setFillColor(...rgb); doc.rect(o.x, o.y, o.w, o.h, 'F'); }
      else if (o.k === 'l') { doc.setDrawColor(...rgb); doc.setLineWidth(o.lw); doc.line(o.x1, o.y1, o.x2, o.y2); }
      else if (o.k === 't') {
        doc.setFont('LS', E.styleName(o)); doc.setFontSize(o.size); doc.setTextColor(...rgb);
        doc.text(o.t, o.x, o.y, o.cs ? { charSpace: o.cs } : undefined);
      } else if (o.k === 'a') { doc.link(o.x, o.y, o.w, o.h, { url: o.url }); }
    }
    return doc.output('blob');
  }

  async function downloadPDF() {
    if (!measureDoc) { toast('The PDF library didn’t load. Reload the page and try again.'); return; }
    let blob;
    try { blob = buildPDF(); } catch (e) { toast('Couldn’t build the PDF. Check the text for unusual characters.'); return; }
    await offerFile(`${fileBase()}_CV.pdf`, blob);
  }

  function importFile(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        cv = normalize(JSON.parse(String(r.result)));
        rerender();
        toast('Data imported. Save to keep it.');
      } catch (e) { toast('That file isn’t CV data exported from this editor.'); }
    };
    r.readAsText(file);
  }

  /* ---------- boot ---------- */
  $('saveBtn').addEventListener('click', save);
  $('pdfBtn').addEventListener('click', downloadPDF);
  $('exportBtn').addEventListener('click', () => offerFile(`${fileBase()}_CV_data.json`, serialize()));
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) importFile(f); e.target.value = ''; });
  const setTab = preview => {
    document.body.classList.toggle('show-preview', preview);
    $('tabEdit').setAttribute('aria-pressed', String(!preview));
    $('tabPreview').setAttribute('aria-pressed', String(preview));
    if (preview) schedulePreview();
  };
  $('tabEdit').addEventListener('click', () => setTab(false));
  $('tabPreview').addEventListener('click', () => setTab(true));
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  });

  async function boot() {
    openSet.add('header');
    let data = CV_DEFAULT;
    try {
      const res = await fetch('data/cv.json', { cache: 'no-store' });
      if (res.ok) data = await res.json();
    } catch (e) { /* use the copy built into the page */ }
    if (STANDALONE) {
      try { const s = localStorage.getItem(SAVED_KEY); if (s) data = JSON.parse(s); } catch (e) {}
    }
    cv = normalize(data);
    savedJSON = serialize();
    try {
      const d = localStorage.getItem(DRAFT_KEY);
      if (d && d !== savedJSON) pendingDraft = normalize(JSON.parse(d));
    } catch (e) { pendingDraft = null; }
    renderEditor();
    setStatus();
    renderPreview();
    use('artifact').then(a => { artifactP = Promise.resolve(a); if (!a && !STANDALONE) { readOnly = true; setStatus(); } });
  }
  boot();
})();
</script>

<script src="../assets/logo-motion.js" defer></script>
